server {
    listen 80;
    server_name padaung.me *.padaung.me;
    
    # Let's Encrypt challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Only redirect if not already HTTPS (check Cloudflare headers)
    location / {
        # Check if request is already HTTPS via Cloudflare
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        
        # If already HTTPS, serve the content
        index index.php index.html;
        root /var/www/public;
        
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
        
        # Set proper headers for Cloudflare
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }
    
    location ~ \.php$ {
        root /var/www/public;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        
        # Set HTTPS headers for Laravel
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name padaung.me *.padaung.me;
    
    # SSL Configuration (wildcard certificate)
    ssl_certificate /etc/letsencrypt/live/padaung.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/padaung.me/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (optional)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    client_max_body_size 40M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    location / {
        proxy_set_header X-Forwarded-Proto https;
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
