services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - network
    depends_on:
      - db

  # Nginx Service
  web:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    networks:
      - network
    depends_on:
      - db

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3304:3306"
    networks:
      - network
  queue_worker:
    build: .
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./:/var/www

  # Certbot Service
  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    command: certonly --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini --email admin@padaung.me --agree-tos --no-eff-email -d padaung.me -d *.padaung.me
    # For individual domains (not recommended for multi-tenant):
    # command: certonly --webroot --webroot-path=/var/www/certbot --email admin@padaung.me --agree-tos --no-eff-email -d padaung.me -d www.padaung.me
    depends_on:
      - web

# Networks
networks:
  network:
    driver: bridge

# Volumes
volumes:
  mysql-data:
    driver: local
